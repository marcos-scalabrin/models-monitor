# Registro auditável da baseline adotada. Consulte o guia de upgrades antes de
# trocar tag ou commit: https://github.com/marcos-scalabrin/bp-best-practices
bp:
  repository: "git@github.com:marcos-scalabrin/bp-best-practices.git"
  version: "v2.13.0"
  commit: "9e2ba10ec8002e9c6ad1ee96d61ae8dba99377de"
  adopted_at: "2026-08-09"

profiles:
  - service
  - project-ops-plane

verification:
  command: "make check"
  ci_workflow: ".github/workflows/ci.yml"

task_server:
  plane:
    workspace: "tp_ai"
    project: "INFRA"
    project_id: "d2de83b4-2a28-4bb6-9cb8-4fdc34b1acce"
    module: "MODELS"
    module_id: "8ed4553a-80b6-4b41-bd28-63132772c7e5"
  local_mirror: "BACKLOG.md"

deviations:
  - bp_rule: "core.md §7.3 (dado de versão única)"
    rationale: >-
      A planilha local ignorada models-data_2026-05-26.xlsx é anterior ao
      controle, não é lida pelo produto e sua origem, dono e reprodutibilidade
      não podem ser inferidos sem abrir ou copiar seu conteúdo.
    compensating_control: >-
      O arquivo é tratado como potencialmente sensível, não é enviado por
      automação e está rastreado no item MODELS-12 até classificação e prova de
      retenção ou regeneração.
    adr: "docs/adrs/adr-2026-08-09_legacy-xlsx-retention.md"
    review_by: "2026-09-09"
